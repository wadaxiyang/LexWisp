schema_version = 1

[plugin]
id = "org.lexwisp.polish"
name = "Polish"
version = "0.1.0"
kind = "declarative"
host_api = "^1.0"

[capabilities]
required = ["ai.invoke"]
optional = []

[[actions]]
id = "polish"
name = "Polish text"
input_kind = "text"
allowed_sources = ["selection", "manual"]
prompt = "prompt.md"
model_profile = "Fast"
dismiss_policy = "cancel"

[[actions.parameters]]
key = "style"
label = "Writing style"
kind = "enum"
required = true
default = "Fluent"
choices = ["Fluent", "Concise", "Academic"]

[actions.output]
format = "text"
allow_copy = true
allow_favorite = true
allow_replace = true
