[package]
name = "lexwisp-ui-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[[bin]]
name = "chart_main_window"
path = "src/chart_main_window.rs"

[[bin]]
name = "lexwisp_main_window"
path = "src/lexwisp_main_window.rs"

[dependencies]
gpui-kit = "=0.6.1"

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }

# Keep this lab independent from the parent LexWisp workspace. It owns its
# dependency lock and can be opened directly as a separate Codex project.
[workspace]
resolver = "3"
