schema_version = 1

[plugin]
id = "org.example.declarative-fixture"
name = "Declarative Fixture"
version = "1.0.0"
kind = "declarative"
host_api = "^1.0"

[capabilities]
required = ["ai.invoke"]
optional = []

[[actions]]
id = "run"
name = "Run Fixture"
input_kind = "text"
allowed_sources = ["selection", "manual", "clipboard"]
prompt = "prompt.md"
model_profile = "Fast"
dismiss_policy = "cancel"

[[actions.parameters]]
key = "mode"
label = "Mode"
kind = "text"
required = true
default = "standard"

[[actions.parameters]]
key = "format"
label = "Format"
kind = "enum"
required = true
default = "plain"
choices = ["plain", "structured", "compact"]

[actions.output]
format = "text"
allow_copy = true
allow_favorite = true
allow_replace = true
