schema_version = 1

[plugin]
id = "org.example.academic-polish"
name = "Academic Polish"
version = "1.0.0"
kind = "declarative"
host_api = "^1.0"

[capabilities]
required = ["ai.invoke"]
optional = []

[[actions]]
id = "academic-polish"
name = "Academic Polish"
input_kind = "text"
allowed_sources = ["selection", "manual", "clipboard"]
prompt = "prompt.md"
model_profile = "Fast"
dismiss_policy = "cancel"

[[actions.parameters]]
key = "discipline"
label = "Discipline"
kind = "text"
required = true
default = "general academic writing"

[[actions.parameters]]
key = "tone"
label = "Tone"
kind = "enum"
required = true
default = "concise"
choices = ["concise", "formal", "accessible"]

[actions.output]
format = "text"
allow_copy = true
allow_favorite = true
allow_replace = true
