[workspace]
members = ["crates/lexwisp-app", "crates/lexwisp-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
anyhow = "=1.0.102"
gpui-kit = "=0.6.1"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
lexwisp-ui = { path = "crates/lexwisp-ui" }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
