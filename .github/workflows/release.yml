name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          rustup default 1.95.0

      - name: Validate tag and package version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a supported release tag."
          }
          $version = $Matches.version
          $metadata = cargo metadata --locked --offline --format-version 1 --no-deps | ConvertFrom-Json
          $app = @($metadata.packages | Where-Object name -eq 'lexwisp-app')
          if ($app.Count -ne 1 -or $app[0].version -ne $version) {
            throw "Tag version $version does not match lexwisp-app."
          }
          "LEXWISP_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEXWISP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked --target x86_64-pc-windows-msvc

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc

      - name: Build Release
        run: cargo build -p lexwisp-app --bin LexWisp --release --locked --target x86_64-pc-windows-msvc

      - name: Package portable ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild -Version $env:LEXWISP_VERSION

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "dist/LexWisp-$env:LEXWISP_TAG-windows-x64.zip"
          $arguments = @(
            'release', 'create', $env:LEXWISP_TAG,
            $archive, "$archive.sha256",
            '--verify-tag',
            '--title', "LexWisp $env:LEXWISP_TAG",
            '--generate-notes'
          )
          if ($env:LEXWISP_VERSION.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
